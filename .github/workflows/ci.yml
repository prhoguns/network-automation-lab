name: CI
on: [push, pull_request]
permissions:
  contents: read

jobs:
  lab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.14", cache: pip }
      - run: pip install -r requirements.txt
      - run: ruff check scripts tests
      - name: Render and check for drift
        run: python scripts/render.py && git diff --exit-code -- configs docker-compose.yml
      - name: Boot the topology
        run: docker compose up -d
      - name: Wait for convergence
        run: |
          for i in $(seq 1 30); do
            est=$(docker exec r2 vtysh -c 'show bgp summary json' 2>/dev/null | grep -c '"state":"Established"' || true)
            [ "$est" -ge 3 ] && break; sleep 5
          done
          docker exec r2 vtysh -c 'show bgp summary'
      - run: pytest -v
      - if: always()
        run: docker compose logs --tail 20
