! isp1 — generated from inventory/topology.yml, do not edit by hand
frr version 10.1
frr defaults traditional
hostname isp1
log stdout
!
interface lo
 ip address 203.0.113.254/32
!
ip prefix-list CUSTOMER-IN seq 10 permit 10.0.0.0/16
ip prefix-list CUSTOMER-IN seq 100 deny 0.0.0.0/0 le 32
route-map FROM-CUSTOMER permit 10
 match ip address prefix-list CUSTOMER-IN
!
router bgp 65100
 bgp router-id 203.0.113.254
 no bgp ebgp-requires-policy
 neighbor 203.0.113.2 remote-as 65000
 neighbor 203.0.113.2 description customer-r1
 neighbor 203.0.113.2 timers connect 10
 address-family ipv4 unicast
  network 203.0.113.254/32
  network 100.64.1.0/24
  network 100.64.2.0/24
  network 100.64.100.0/24
  neighbor 203.0.113.2 route-map FROM-CUSTOMER in
 exit-address-family
!
ip route 100.64.1.0/24 Null0
ip route 100.64.2.0/24 Null0
ip route 100.64.100.0/24 Null0
line vty
!