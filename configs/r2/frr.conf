! r2 — generated from inventory/topology.yml, do not edit by hand
frr version 10.1
frr defaults traditional
hostname r2
log stdout
!
interface lo
 ip address 10.0.255.2/32
!
router ospf
 ospf router-id 10.0.255.2
 network 10.0.255.2/32 area 0
 network 10.0.12.0/29 area 0
 network 10.0.24.0/29 area 0
!
!
!
ip prefix-list BOGONS seq 10 permit 0.0.0.0/8 le 32
ip prefix-list BOGONS seq 20 permit 10.0.0.0/8 le 32
ip prefix-list BOGONS seq 30 permit 127.0.0.0/8 le 32
ip prefix-list BOGONS seq 40 permit 169.254.0.0/16 le 32
ip prefix-list BOGONS seq 50 permit 172.16.0.0/12 le 32
ip prefix-list BOGONS seq 60 permit 192.168.0.0/16 le 32
ip prefix-list BOGONS seq 70 permit 224.0.0.0/3 le 32
ip prefix-list OUR-AGGREGATE seq 10 permit 10.0.0.0/16
!
route-map ISP-IN deny 10
 match ip address prefix-list BOGONS
route-map ISP-IN deny 20
 match ip address prefix-list OUR-AGGREGATE
route-map ISP-IN permit 30
 set local-preference 100
!
route-map ISP-OUT permit 10
 match ip address prefix-list OUR-AGGREGATE
route-map ISP-OUT deny 20
!
router bgp 65000
 bgp router-id 10.0.255.2
 no bgp ebgp-requires-policy
 bgp log-neighbor-changes
 neighbor 10.0.255.1 remote-as 65000
 neighbor 10.0.255.1 update-source 10.0.255.2
 neighbor 10.0.255.1 description ibgp-r1
 neighbor 10.0.255.1 timers connect 10
 neighbor 10.0.255.3 remote-as 65000
 neighbor 10.0.255.3 update-source 10.0.255.2
 neighbor 10.0.255.3 description ibgp-r3
 neighbor 10.0.255.3 timers connect 10
 neighbor 10.0.255.4 remote-as 65000
 neighbor 10.0.255.4 update-source 10.0.255.2
 neighbor 10.0.255.4 description ibgp-r4
 neighbor 10.0.255.4 timers connect 10
 address-family ipv4 unicast
  aggregate-address 10.0.0.0/16 summary-only
  network 10.0.255.2/32
  neighbor 10.0.255.1 next-hop-self
  neighbor 10.0.255.3 next-hop-self
  neighbor 10.0.255.4 next-hop-self
 exit-address-family
!
line vty
!